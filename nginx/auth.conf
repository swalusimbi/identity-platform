# ─── Rate limiting zones (must be in http {} block) ───────────────
# Add these to your main nginx.conf inside the http {} block:
#
#   limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;
#   limit_req_zone $binary_remote_addr zone=auth_general:10m rate=30r/s;

server {
    server_tokens off;
    server_name auth.example.com;

    location / {
        # Stricter rate limit on auth endpoints
        limit_req zone=auth_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Client management takes the admin key, so serve it only to the
    # operator network (a VPN or office range). Everything else stays
    # public. Replace the range with your own. ~* matches any casing,
    # which matters because the app routes /CLIENTS like /clients.
    location ~* ^/clients(/|$) {
        allow 10.8.0.0/24;
        deny all;
        error_page 403 = @operator_only;

        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @operator_only {
        default_type application/json;
        return 403 '{"error":"Client management is only reachable from the operator network","code":"OPERATOR_NETWORK_ONLY"}';
    }

    # Tighter limit on login/register
    location ~* ^/auth/(login|register) {
        limit_req zone=auth_login burst=3 nodelay;

        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
